spring:
  application:
    name: nalitech-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nalitech}
    username: ${DB_USER:nalitech}
    password: ${DB_PASSWORD:nalitech}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway e a fonte da verdade do schema; Hibernate nunca altera tabelas.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:nalitech}
    password: ${RABBITMQ_PASSWORD:nalitech}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:60MB}

server:
  port: ${SERVER_PORT:8080}

# ----- Configuracoes proprias da aplicacao (lidas via @ConfigurationProperties) -----
nalitech:
  jwt:
    secret: ${JWT_SECRET:troque-isso-por-um-segredo-forte-com-no-minimo-32-bytes}
    expiration-seconds: ${JWT_EXPIRATION:3600}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION:2592000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:nalitech}
    secret-key: ${STORAGE_SECRET_KEY:nalitech123}
    bucket: ${STORAGE_BUCKET:nalitech-files}
    region: ${STORAGE_REGION:us-east-1}
  rate-limit:
    # Requisicoes permitidas por janela nos endpoints publicos (login, reset de senha).
    capacity: ${RATE_LIMIT_CAPACITY:10}
    refill-period-seconds: ${RATE_LIMIT_REFILL_SECONDS:60}

# ----- Actuator / observabilidade (E0-Task 7, E17) -----
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
  # Em producao sem Redis/RabbitMQ/SMTP, desligue estes indicadores para que
  # /actuator/health nao fique DOWN (ex: REDIS_HEALTH_ENABLED=false no deploy free).
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:true}
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:true}
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

# ----- OpenAPI / Swagger (E0-Task 8) -----
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:true}
